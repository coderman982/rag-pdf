name: rag-pdf

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # The qdrant image ships no curl/wget. Invoke bash explicitly: CMD-SHELL
      # runs /bin/sh (dash), which has no /dev/tcp support.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # FastAPI app exposing the Inngest functions at /api/inngest
  api:
    build: .
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      INNGEST_DEV: "true"
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    volumes:
      # Must be the SAME path inside api and streamlit.
      - uploads:/data/uploads
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Self-hosted Inngest engine.
  # NOTE: the inngest CLI (v1.45) has no `serve` subcommand - it has `dev` and
  # `start`. `start` requires external persistence (Postgres) via --config.
  # `dev` runs standalone, which is what this stack uses.
  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest", "--host", "0.0.0.0"]
    depends_on:
      - api
    ports:
      - "8288:8288"

  streamlit:
    build: .
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      INNGEST_DEV: "true"
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      QDRANT_URL: http://qdrant:6333
      UPLOADS_DIR: /data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
    volumes:
      # Same volume as api: the ingest event carries an absolute file path,
      # so both processes must resolve it identically.
      - uploads:/data/uploads
    depends_on:
      - api
      - inngest
    ports:
      - "8501:8501"

volumes:
  qdrant_data:
  uploads: